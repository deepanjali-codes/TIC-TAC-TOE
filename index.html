<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <lilnk rel="icon" type="image/png" href="https://p7.hiclipart.com/preview/748/778/449/ghost-pixel-art-gif-image-cute-pixel-thumbnail.jpg">
<title>Tic Tac Toe</title>
<style>
* {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    background: linear-gradient(135deg, #667eea, #764ba2);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
    justify-content: center;
    align-items: center;
    color: #fff;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    user-select: none;
  }

  h1 {
    font-weight: 700;
    margin-bottom: 0.2em;
    font-size: 2.5rem;
    text-shadow: 0 0 10px rgba(231, 151, 151, 0.786);
    color: blue;
  }

  #status {
    font-size: 1.3rem;
    margin-bottom: 1em;
    font-weight: 600;
    text-shadow: 0 0 6px rgba(234, 131, 131, 0.69);
    color: rgb(93, 27, 214);
  }

  #board {
    display: grid;
    grid-template-columns: repeat(3, minmax(80px, 100px));
    grid-template-rows: repeat(3, minmax(80px, 100px));
    gap: 12px;
    margin-bottom: 1.5em;
  }

  .cell {
    background: rgba(255,255,255,0.1);
    border-radius: 12px;
    box-shadow:
      inset 0 3px 15px rgba(255,255,255,0.2),
      0 6px 10px rgba(0,0,0,0.2);
    font-size: 2.5rem;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    user-select: none;
    transition: background 0.3s ease;
    font-weight: 900;
    font-family: 'Arial Black', Arial, sans-serif;
  }
  .cell:hover {
    background: rgba(255,255,255,0.25);
  }
  .cell.disabled {
    cursor: default;
    color: #bbb;
  }

  button#restart-btn {
    background: #5f4ba2;
    border: none;
    padding: 0.7em 1.8em;
    border-radius: 30px;
    font-size: 1.1rem;
    font-weight: 700;
    color: #fff;
    box-shadow: 0 4px 18px rgba(118,75,162,0.6);
    transition: background 0.3s ease, box-shadow 0.3s ease;
    user-select: none;
  }
  button#restart-btn:hover {
    background: #e7c4c4b9;
    box-shadow: 0 6px 24px rgba(192, 57, 57, 0.8);
  }

  /* Mobile friendly */
  @media (max-width: 400px) {
    #board {
      grid-template-columns: repeat(3, 80px);
      grid-template-rows: repeat(3, 80px);
      gap: 10px;
    }
    .cell {
      font-size: 2rem;
    }
  }
</style>
</head>
<body>
  <h1>Tic Tac Toe</h1>
  <div id="status">Player X's turn</div>
  <div id="board" aria-label="Tic Tac Toe Board" role="grid" tabindex="0">

  </div>
  <button id="restart-btn" aria-label="Restart Game">Restart Game</button>
</body>
</html>
